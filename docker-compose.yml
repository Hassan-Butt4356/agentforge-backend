version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AgentForge — Docker Compose (Development)
#
# Services:
#   db        — PostgreSQL 16
#   redis     — Celery message broker
#   chromadb  — Vector database (persistent)
#   ollama    — Local LLM + embedding model server
#   web       — Django development server
#   celery    — Background worker for PDF ingestion tasks
#
# First-time setup:
#   1. docker-compose up --build
#   2. docker-compose exec ollama ollama pull llama3:latest
#   3. docker-compose exec ollama ollama pull nomic-embed-text:latest
#   4. docker-compose exec web python manage.py createsuperuser
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: agentforge_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: agentforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── ChromaDB ─────────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: agentforge_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    ports:
      - "8001:8000"   # ChromaDB listens on 8000 internally; we expose as 8001
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Ollama (LLM + Embeddings) ─────────────────────────────────
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: agentforge_ollama
  #   restart: unless-stopped
  #   volumes:
  #     - ollama_data:/root/.ollama   # models are cached here; survives restarts
  #   ports:
  #     - "11434:11434"
    # ── GPU support (requires nvidia-container-toolkit on host) ──
    # Uncomment the deploy block below for GPU acceleration.
    # Without it, Ollama uses CPU (slow but works).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Ollama model puller ───────────────────────────────────────
  # One-shot container that pulls models on first run, then exits.
  # ollama-setup:
  #   image: ollama/ollama:latest
  #   container_name: agentforge_ollama_setup
  #   depends_on:
  #     - ollama
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   entrypoint: >
  #     sh -c "
  #       echo 'Waiting for Ollama to start...' &&
  #       sleep 10 &&
  #       ollama pull llama3:latest &&
  #       ollama pull nomic-embed-text:latest &&
  #       echo 'Models ready.'
  #     "
  #   environment:
  #     - OLLAMA_HOST=http://ollama:11434
  #   restart: "no"   # run once only

  # ── Django web server ─────────────────────────────────────────
  web:
    build:
      context: .
      target: builder
    container_name: agentforge_web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --settings=config.settings.development &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_MODE: http
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"    # internal ChromaDB port inside Docker network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ── Celery worker ─────────────────────────────────────────────
  celery:
    build:
      context: .
      target: builder
    container_name: agentforge_celery
    restart: unless-stopped
    # One worker, concurrency=2 — handles 2 ingestion tasks simultaneously.
    # Increase concurrency if you have more CPU cores and RAM.
    command: celery -A config worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
      - media_volume:/app/media    # worker needs access to uploaded PDFs
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DB_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_MODE: http
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # ── Celery Beat (optional scheduled tasks) ────────────────────
  # Uncomment if you need periodic tasks (e.g. cleanup old conversations).
  # celery-beat:
  #   build:
  #     context: .
  #     target: builder
  #   container_name: agentforge_celery_beat
  #   command: celery -A config beat --loglevel=info
  #   volumes:
  #     - .:/app
  #   env_file:
  #     - .env
  #   environment:
  #     DJANGO_SETTINGS_MODULE: config.settings.development
  #     DB_HOST: db
  #     REDIS_URL: redis://redis:6379/0
  #   depends_on:
  #     - redis
  #     - db

volumes:
  postgres_data:
  chroma_data:
  # ollama_data:
  media_volume:
