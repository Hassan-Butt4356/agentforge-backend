version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AgentForge — Docker Compose (Production)
# Usage: docker-compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    container_name: agentforge_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # In production: do NOT expose port 5432 to the host.

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentforge_web
    restart: always
    command: sh scripts/entrypoint.sh
    volumes:
      - media_volume:/app/media
      - vector_store_volume:/app/vector_store
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.25-alpine
    container_name: agentforge_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  postgres_data:
  media_volume:
  vector_store_volume:
  static_volume:
